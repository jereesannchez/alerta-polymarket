name: Alerta Polymarket

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chequear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chequear precio y avisar
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 alerta_una_vez.py

      - name: Guardar estado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add estado.txt
          git diff --staged --quiet || (git commit -m "estado" && git push)
